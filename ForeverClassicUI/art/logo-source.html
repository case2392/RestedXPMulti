<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #222; }
  .sheet { display: flex; gap: 40px; padding: 40px; }
  svg { display: block; }
</style>
</head>
<body>
<div class="sheet">

<!-- A: gold frame, CLASSIC over a big UI, FOREVER ribbon -->
<svg id="a" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3a2a16"/>
      <stop offset="0.6" stop-color="#1d1409"/>
      <stop offset="1" stop-color="#0a0703"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e2b64a"/>
      <stop offset="0.6" stop-color="#a8761c"/>
      <stop offset="1" stop-color="#f3d77a"/>
    </linearGradient>
    <linearGradient id="goldFlat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc86"/>
      <stop offset="0.5" stop-color="#c99a34"/>
      <stop offset="1" stop-color="#8a6116"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5221f"/>
      <stop offset="0.5" stop-color="#7a1412"/>
      <stop offset="1" stop-color="#4e0b0a"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a0f0e"/>
      <stop offset="1" stop-color="#360706"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.45" stop-color="#b9bcc2"/>
      <stop offset="0.55" stop-color="#7c8089"/>
      <stop offset="1" stop-color="#e6e8ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#000" opacity="0"/>
      <circle cx="1" cy="1" r="0.8" fill="#fff" opacity="0.045"/>
      <circle cx="4" cy="4" r="0.6" fill="#000" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="28" fill="url(#bg)"/>
  <rect width="512" height="512" rx="28" fill="url(#grain)"/>

  <!-- outer gold frame with inner dark line and corner rivets -->
  <rect x="14" y="14" width="484" height="484" rx="20" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="26" y="26" width="460" height="460" rx="12" fill="none" stroke="#2a1a05" stroke-width="3"/>
  <rect x="30" y="30" width="452" height="452" rx="10" fill="none" stroke="#f1d27a" stroke-width="1.5" opacity="0.5"/>
  <g fill="url(#goldFlat)" stroke="#3b2607" stroke-width="2">
    <circle cx="36" cy="36" r="11"/><circle cx="476" cy="36" r="11"/>
    <circle cx="36" cy="476" r="11"/><circle cx="476" cy="476" r="11"/>
  </g>

  <!-- CLASSIC -->
  <text x="256" y="150" text-anchor="middle" font-family="Cinzel, 'Liberation Serif', serif" font-weight="900" font-size="74"
        fill="url(#gold)" stroke="#2a1a05" stroke-width="3" paint-order="stroke" filter="url(#shadow)" letter-spacing="4">CLASSIC</text>

  <!-- UI -->
  <text x="256" y="345" text-anchor="middle" font-family="Cinzel, 'Liberation Serif', serif" font-weight="900" font-size="200"
        fill="url(#steel)" stroke="#111" stroke-width="6" paint-order="stroke" filter="url(#shadow)" letter-spacing="10">UI</text>

  <!-- FOREVER ribbon -->
  <g filter="url(#shadow)">
    <!-- ribbon tails -->
    <polygon points="60,392 120,392 120,452 60,452 84,422" fill="url(#ribbonDark)" stroke="#2a0605" stroke-width="2"/>
    <polygon points="452,392 392,392 392,452 452,452 428,422" fill="url(#ribbonDark)" stroke="#2a0605" stroke-width="2"/>
    <!-- ribbon body -->
    <rect x="96" y="384" width="320" height="64" rx="6" fill="url(#ribbon)" stroke="#2a0605" stroke-width="3"/>
    <rect x="102" y="390" width="308" height="52" rx="4" fill="none" stroke="#e8b95a" stroke-width="1.5" opacity="0.7"/>
    <text x="256" y="432" text-anchor="middle" font-family="Cinzel, 'Liberation Serif', serif" font-weight="700" font-size="42"
          fill="#f7e7b6" stroke="#2a0605" stroke-width="2" paint-order="stroke" letter-spacing="8">FOREVER</text>
  </g>
</svg>

<!-- B: round minimap ring with CUI -->
<svg id="b" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2c3d5a"/>
      <stop offset="0.7" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0.6" stop-color="#a8761c"/>
      <stop offset="1" stop-color="#f3d77a"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5221f"/>
      <stop offset="0.5" stop-color="#7a1412"/>
      <stop offset="1" stop-color="#4e0b0a"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.85"/>

  </defs>
  <rect width="512" height="512" rx="28" fill="#0a0703"/>
  <circle cx="256" cy="256" r="236" fill="url(#bg2)"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#gold2)" stroke-width="18"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#2a1a05" stroke-width="3"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#3b2607" stroke-width="3"/>

    <line x1="24" y1="256" x2="50" y2="256"/><line x1="462" y1="256" x2="488" y2="256"/>
  </g>
  <text x="256" y="172" text-anchor="middle" font-family="Cinzel, 'Liberation Serif', serif" font-weight="900" font-size="58"
        fill="url(#gold2)" stroke="#2a1a05" stroke-width="3" paint-order="stroke" filter="url(#shadow2)" letter-spacing="3">CLASSIC</text>
  <text x="256" y="330" text-anchor="middle" font-family="Cinzel, 'Liberation Serif', serif" font-weight="900" font-size="180"
        fill="#e9ecf0" stroke="#111" stroke-width="6" paint-order="stroke" filter="url(#shadow2)" letter-spacing="8">UI</text>
  <g filter="url(#shadow2)">
    <rect x="120" y="366" width="272" height="56" rx="6" fill="url(#ribbon2)" stroke="#2a0605" stroke-width="3"/>
    <rect x="126" y="372" width="260" height="44" rx="4" fill="none" stroke="#e8b95a" stroke-width="1.5" opacity="0.7"/>
    <text x="256" y="408" text-anchor="middle" font-family="Cinzel, 'Liberation Serif', serif" font-weight="700" font-size="36"
          fill="#f7e7b6" stroke="#2a0605" stroke-width="2" paint-order="stroke" letter-spacing="7">FOREVER</text>
  </g>
</svg>


<!-- C: B with more Warcraft in it: stone ring with runes and gems, crossed swords and a shield behind the UI, curved CLASSIC -->
<svg id="c" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#3b5a8a"/>
      <stop offset="0.45" stop-color="#1b2c4c"/>
      <stop offset="0.85" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e2b64a"/>
      <stop offset="0.6" stop-color="#a8761c"/>
      <stop offset="1" stop-color="#f3d77a"/>
    </linearGradient>
    <linearGradient id="goldFlat3" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0.52" stop-color="#8d929b"/>

      <stop offset="0.5" stop-color="#7a1412"/>
      <stop offset="1" stop-color="#4e0b0a"/>
    </linearGradient>
    <linearGradient id="ribbonDark3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a0f0e"/>
      <stop offset="1" stop-color="#360706"/>

    <linearGradient id="shield3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="1" stop-color="#0d1322"/>

    <radialGradient id="gem" cx="35%" cy="30%" r="70%">

      <stop offset="0.4" stop-color="#2f8de0"/>
      <stop offset="1" stop-color="#0b2d63"/>

      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.85"/>

      <circle cx="2" cy="3" r="0.9" fill="#fff" opacity="0.05"/>
      <circle cx="7" cy="8" r="0.7" fill="#000" opacity="0.35"/>
    </pattern>
    <path id="arcTop" d="M 91 256 A 165 165 0 0 1 421 256"/>
  </defs>

  <rect width="512" height="512" rx="28" fill="#07080c"/>
  <!-- inner disc -->
  <circle cx="256" cy="256" r="230" fill="url(#bg3)"/>
  <circle cx="256" cy="256" r="230" fill="url(#stone)"/>
  <!-- light burst behind the centre -->
  <circle cx="256" cy="250" r="120" fill="#4d7fc4" opacity="0.25" filter="url(#glow3)"/>

  <!-- crossed swords -->
  <g filter="url(#shadow3)">
    <g transform="translate(256 286) rotate(-52)">
      <path d="M0,-206 L12,-184 L12,46 L-12,46 L-12,-184 Z" fill="url(#steel3)" stroke="#2b2f36" stroke-width="2"/>
      <line x1="0" y1="-150" x2="0" y2="30" stroke="#6f747c" stroke-width="2" opacity="0.7"/>
      <rect x="-38" y="44" width="76" height="14" rx="4" fill="url(#goldFlat3)" stroke="#3b2607" stroke-width="2"/>
      <rect x="-8" y="58" width="16" height="44" fill="#3a2314" stroke="#1d1108" stroke-width="2"/>
      <circle cx="0" cy="112" r="12" fill="url(#goldFlat3)" stroke="#3b2607" stroke-width="2"/>
    </g>
    <g transform="translate(256 286) rotate(52)">
      <path d="M0,-206 L12,-184 L12,46 L-12,46 L-12,-184 Z" fill="url(#steel3)" stroke="#2b2f36" stroke-width="2"/>
      <line x1="0" y1="-150" x2="0" y2="30" stroke="#6f747c" stroke-width="2" opacity="0.7"/>
      <rect x="-38" y="44" width="76" height="14" rx="4" fill="url(#goldFlat3)" stroke="#3b2607" stroke-width="2"/>
      <rect x="-8" y="58" width="16" height="44" fill="#3a2314" stroke="#1d1108" stroke-width="2"/>
      <circle cx="0" cy="112" r="12" fill="url(#goldFlat3)" stroke="#3b2607" stroke-width="2"/>
    </g>
  </g>

  <!-- heraldic shield behind the UI -->
  <g filter="url(#shadow3)">
    <path d="M256,158 C296,178 322,180 342,178 L342,280 C342,336 296,372 256,392 C216,372 170,336 170,280 L170,178 C190,180 216,178 256,158 Z"
          fill="url(#shield3)" stroke="url(#gold3)" stroke-width="8"/>
    <path d="M256,171 C292,189 316,191 331,190 L331,278 C331,326 292,358 256,376 C220,358 181,326 181,278 L181,190 C196,191 220,189 256,171 Z"

  <!-- UI -->

  <!-- the ring: gold, with an inner bead, rune notches and four gems -->

  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#gold3)" stroke-width="24"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#3b2607" stroke-width="3"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#3b2607" stroke-width="3"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#f7e3a0" stroke-width="1.5" opacity="0.5"/>
  <g stroke="#3b2607" stroke-width="3" stroke-linecap="round">

    <use href="#notch" transform="rotate(30 256 256)"/><use href="#notch" transform="rotate(60 256 256)"/>
    <use href="#notch" transform="rotate(120 256 256)"/><use href="#notch" transform="rotate(150 256 256)"/>

    <use href="#notch" transform="rotate(300 256 256)"/><use href="#notch" transform="rotate(330 256 256)"/>

    <use href="#gemN" transform="rotate(180 256 256)"/>
    <use href="#gemN" transform="rotate(270 256 256)"/>

  <!-- CLASSIC along the top of the disc -->
  <text font-family="Cinzel, 'Liberation Serif', serif" font-weight="900" font-size="50" fill="url(#gold3)"
        stroke="#2a1a05" stroke-width="3" paint-order="stroke" filter="url(#shadow3)" letter-spacing="6">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">CLASSIC</textPath>
  </text>

  <!-- FOREVER ribbon -->
  <g filter="url(#shadow3)">
    <polygon points="84,398 136,398 136,452 84,452 104,425" fill="url(#ribbonDark3)" stroke="#2a0605" stroke-width="2"/>
    <polygon points="428,398 376,398 376,452 428,452 408,425" fill="url(#ribbonDark3)" stroke="#2a0605" stroke-width="2"/>
    <rect x="116" y="390" width="280" height="60" rx="6" fill="url(#ribbon3)" stroke="#2a0605" stroke-width="3"/>
    <rect x="122" y="396" width="268" height="48" rx="4" fill="none" stroke="#e8b95a" stroke-width="1.5" opacity="0.7"/>
    <text x="256" y="434" text-anchor="middle" font-family="Cinzel, 'Liberation Serif', serif" font-weight="700" font-size="38"
          fill="#f7e7b6" stroke="#2a0605" stroke-width="2" paint-order="stroke" letter-spacing="7">FOREVER</text>
  </g>
</svg>
<!-- D: C tuned for the 70px list view: B with more Warcraft in it: stone ring with runes and gems, crossed swords and a shield behind the UI, curved CLASSIC -->

      <line x1="0" y1="-150" x2="0" y2="30" stroke="#6f747c" stroke-width="2" opacity="0.7"/>
      <rect x="-38" y="44" width="76" height="14" rx="4" fill="url(#goldFlat3)" stroke="#3b2607" stroke-width="2"/>

  <!-- the ring: gold, with an inner bead, rune notches and four gems -->
  <circle cx="256" cy="256" r="234" fill="none" stroke="#2a1a05" stroke-width="22"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="url(#gold3)" stroke-width="16"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#3b2607" stroke-width="3"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#3b2607" stroke-width="3"/>
